[package]
name = "icofon"
version = "0.2.0"
edition = "2024"
description = "Build an icon font (TTF + CSS) from a folder of SVG files"
authors = ["Alexander Ivashkin"]
license = "MIT"
repository = "https://github.com/JWo1F/icofon"
homepage = "https://github.com/JWo1F/icofon"
readme = "README.md"
keywords = ["icon", "font", "svg", "truetype", "css"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
kurbo = "0.13"
usvg = { version = "0.48", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
write-fonts = "0.52"
flate2 = "1.1.10"
brotli = "8.0.4"
toml = "1.1.4"
notify = "8.2.0"

[dev-dependencies]
read-fonts = "0.43"
