# Build Homebrew bottles for a released version.
#
# A bottle is a precompiled build, so `brew install` unpacks it instead of
# compiling from source and pulling in the Rust toolchain. One is built per
# macOS version and architecture; anything not covered here falls back to a
# source build, which still works.
#
# The formula in JWo1F/homebrew-tap must already point at this version before
# this runs -- the bottles are built from whatever the formula says.

name: Bottle

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to bottle, without the leading v"
        required: true
        type: string

permissions:
  contents: write

env:
  FORMULA: jwo1f/tap/icofon

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon back to Sonoma, plus Intel. Homebrew falls back to a
        # bottle from an older macOS of the same architecture, so these cover
        # more than the five names suggest.
        os: [macos-26, macos-15, macos-14, macos-15-intel]
    steps:
      - name: Tap
        # A third-party tap has to be trusted before its formulae will load.
        run: |
          brew tap JWo1F/tap
          brew trust JWo1F/tap

      - name: Check the formula is at ${{ inputs.version }}
        run: |
          set -euo pipefail
          have=$(brew info --json=v2 "$FORMULA" | python3 -c 'import json,sys; print(json.load(sys.stdin)["formulae"][0]["versions"]["stable"])')
          if [ "$have" != "${{ inputs.version }}" ]; then
            echo "::error::tap formula is at $have, not ${{ inputs.version }}. Update it first."
            exit 1
          fi

      - name: Build the bottle
        run: |
          set -euo pipefail
          brew install --build-bottle "$FORMULA"
          brew bottle --json --no-rebuild \
            --root-url="https://github.com/JWo1F/icofon/releases/download/v${{ inputs.version }}" \
            "$FORMULA"
          # Homebrew writes `name--version` locally but downloads `name-version`.
          for f in *--*.bottle.tar.gz; do mv "$f" "${f/--/-}"; done
          ls -la ./*.bottle.*

      - name: Run the formula's test against the build
        run: brew test "$FORMULA"

      - name: Check the bottle carries a working binary
        run: |
          set -euo pipefail
          tar -xzf ./*.bottle.tar.gz
          ./icofon/${{ inputs.version }}/bin/icofon --version

      - uses: actions/upload-artifact@v4
        with:
          name: bottle-${{ matrix.os }}
          path: |
            *.bottle.tar.gz
            *.bottle.json
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: macos-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bottles
          merge-multiple: true

      - name: Attach the bottles to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ inputs.version }}" bottles/*.bottle.tar.gz --clobber --repo "${{ github.repository }}"

      - name: Write the bottle block into the formula
        run: |
          set -euo pipefail
          brew tap JWo1F/tap
          brew trust JWo1F/tap
          brew bottle --merge --write --no-commit bottles/*.bottle.json
          git -C "$(brew --repository JWo1F/tap)" diff

      # Needs a personal access token with contents:write on JWo1F/homebrew-tap.
      # Without it the run still produces the bottles and the diff above, which
      # can be applied to the formula by hand.
      - name: Commit the formula
        if: ${{ env.TAP_TOKEN != '' }}
        run: |
          set -euo pipefail
          cd "$(brew --repository JWo1F/tap)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${TAP_TOKEN}@github.com/JWo1F/homebrew-tap.git"
          git commit -am "icofon ${{ inputs.version }}: bottles"
          git push origin HEAD:main

      - name: Say what to do if the formula was not committed
        if: ${{ env.TAP_TOKEN == '' }}
        run: echo "::notice::No TAP_TOKEN secret, so the formula was not pushed. Copy the bottle block from the diff above into Formula/icofon.rb."
